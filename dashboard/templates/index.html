<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORACLE // Console</title>
<style>
  :root {
    --bg: #0a0e12;
    --panel: #10151b;
    --line: #1f2b33;
    --amber: #ffb347;
    --cyan: #5fd4d6;
    --red: #ff5c5c;
    --text: #c9d6dc;
    --text-dim: #5c7079;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    min-height: 100vh;
    padding: 32px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-attachment: fixed;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }

  .brand {
    font-size: 28px;
    letter-spacing: 6px;
    color: var(--amber);
    font-weight: 700;
  }

  .brand span { color: var(--text-dim); font-weight: 400; letter-spacing: 2px; }

  .status-line {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 16px 20px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 30px;
    color: var(--cyan);
    font-weight: 700;
  }

  .stat-value.warn { color: var(--red); }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 900px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .panel-body {
    max-height: 480px;
    overflow-y: auto;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }

  .row:last-child { border-bottom: none; }

  .row-name { color: var(--text); }
  .row-meta { color: var(--text-dim); font-size: 12px; }

  .badge {
    font-size: 10px;
    padding: 2px 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .badge.ok { color: var(--cyan); border: 1px solid var(--cyan); }
  .badge.error { color: var(--red); border: 1px solid var(--red); }

  .anomaly-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }

  .anomaly-row:last-child { border-bottom: none; }

  .anomaly-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .severity {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 8px;
  }

  .severity.warning { color: var(--amber); border: 1px solid var(--amber); }
  .severity.critical { color: var(--red); border: 1px solid var(--red); background: rgba(255,92,92,0.08); }

  .anomaly-msg { font-size: 13px; color: var(--text); }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">ORACLE <span>// AGENT INTEL CONSOLE</span></div>
  <div class="status-line"><span class="pulse"></span>LIVE — polling every 5s</div>
</header>

<div class="stats-grid" id="stats"></div>

<div class="panels">
  <div class="panel">
    <div class="panel-header">Recent Spans</div>
    <div class="panel-body" id="spans"></div>
  </div>
  <div class="panel">
    <div class="panel-header">Anomaly Feed</div>
    <div class="panel-body" id="anomalies"></div>
  </div>
</div>

<script>
async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

function renderStats(s) {
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Spans</div><div class="stat-value">${s.total_spans}</div></div>
    <div class="stat-card"><div class="stat-label">Agent Runs</div><div class="stat-value">${s.total_runs}</div></div>
    <div class="stat-card"><div class="stat-label">Errors</div><div class="stat-value ${s.error_count > 0 ? 'warn' : ''}">${s.error_count}</div></div>
    <div class="stat-card"><div class="stat-label">Avg Latency</div><div class="stat-value">${s.avg_latency_ms}<span style="font-size:14px;color:var(--text-dim)">ms</span></div></div>
    <div class="stat-card"><div class="stat-label">Total Cost</div><div class="stat-value">$${s.total_cost_usd}</div></div>
  `;
}

function renderSpans(spans) {
  const el = document.getElementById('spans');
  if (!spans.length) {
    el.innerHTML = '<div class="empty">No spans recorded yet. Run the simulator or instrument an agent.</div>';
    return;
  }
  el.innerHTML = spans.slice(0, 30).map(s => `
    <div class="row">
      <div>
        <div class="row-name">${s.name} <span class="row-meta">[${s.kind}]</span></div>
        <div class="row-meta">${s.duration_ms ? s.duration_ms.toFixed(1) + 'ms' : '—'}</div>
      </div>
      <div class="badge ${s.status}">${s.status}</div>
    </div>
  `).join('');
}

function renderAnomalies(anomalies) {
  const el = document.getElementById('anomalies');
  if (!anomalies.length) {
    el.innerHTML = '<div class="empty">No anomalies detected. Baseline nominal.</div>';
    return;
  }
  el.innerHTML = anomalies.map(a => `
    <div class="anomaly-row">
      <div class="anomaly-top">
        <span class="row-meta">${a.kind}</span>
        <span class="severity ${a.severity}">${a.severity}</span>
      </div>
      <div class="anomaly-msg">${a.message}</div>
    </div>
  `).join('');
}

async function refresh() {
  const [stats, spans, anomalies] = await Promise.all([
    fetchJSON('/api/stats'),
    fetchJSON('/api/spans'),
    fetchJSON('/api/anomalies'),
  ]);
  renderStats(stats);
  renderSpans(spans);
  renderAnomalies(anomalies);
}

refresh();
setInterval(refresh, 5000);
</script>

</body>
</html>
