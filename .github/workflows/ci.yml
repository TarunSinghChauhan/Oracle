name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt langchain-core
      - name: Run tests
        run: python -m pytest tests -q

  core-without-optional-deps:
    # ORACLE's core promises not to need langchain-core; make sure it holds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (no langchain-core)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (LangChain integration tests are skipped)
        run: python -m pytest tests -q -rs
